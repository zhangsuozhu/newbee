<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>newbee · 会话协作高保真原型</title>
<style>
:root{--bg:#0f1115;--panel:#161a21;--elev:#1d232d;--line:#2a313c;--fg:#e8ecf1;--fg2:#b6bdc9;--fg3:#7d8590;--cap:#656d76;--accent:#6c8cff;--accent-soft:#a5bffc;--accent-bg:#26324a;--green:#3fb950;--red:#f85149;--warn:#e5a13d;--mono:'SF Mono','JetBrains Mono',Consolas,monospace;--font:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}
*{box-sizing:border-box}body{margin:0;height:100vh;background:var(--bg);color:var(--fg);font:14px/1.55 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
.app{height:100vh;display:grid;grid-template-columns:266px minmax(0,1fr) 320px}
.btn{border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--elev);color:var(--fg)}.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}.btn.primary:hover{filter:brightness(1.12)}
.btn.small{padding:4px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:default}
/* 侧栏 */
#sidebar{background:var(--panel);border-right:1px solid var(--line);padding:14px 11px;display:flex;flex-direction:column;gap:11px;min-height:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;padding:2px 6px 4px;font-size:15px}
.logo{width:22px;height:22px;border-radius:7px;background:var(--accent);display:grid;place-items:center;font-size:12px}
.side-head{display:flex;justify-content:space-between;align-items:center;color:var(--fg3);font-size:12px;font-weight:650;padding:0 6px}
.search{width:100%;background:var(--elev);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--fg);outline:0;font:inherit}
.search:focus{border-color:var(--accent)}
#sessions{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
.srow{display:flex;align-items:flex-start;gap:4px}
.srow .pick{margin:14px 0 0 6px;accent-color:var(--accent);flex:none}
.session{flex:1;min-width:0;text-align:left;background:transparent;border:0;border-radius:8px;padding:8px 9px;cursor:pointer;color:var(--fg2);font:inherit}
.session:hover{background:var(--elev);color:var(--fg)}
.session.active{background:var(--elev);color:var(--fg);box-shadow:inset 2px 0 0 var(--accent)}
.session .nm{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.session .mt{display:flex;align-items:center;gap:6px;color:var(--cap);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session.child{margin-left:22px}
.badge{background:var(--accent);color:#fff;border-radius:9px;font-size:10px;padding:0 6px;line-height:15px;flex:none}
.badge.warn{background:var(--warn);color:#1c1710}
.toggle{border:0;background:transparent;color:var(--fg3);cursor:pointer;font-size:12px;width:20px;padding:10px 0 0 6px;text-align:left}
.group-nav{border-left:1px solid var(--line);margin-left:14px}
.group-label{color:var(--cap);font-size:11px;font-weight:650;padding:8px 8px 3px}
.side-foot{border-top:1px solid var(--line);padding-top:11px;color:var(--cap);font-size:12px}
/* 主列 */
#main{display:flex;flex-direction:column;min-width:0}
#topbar{height:56px;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel)}
#topTitle{font-weight:650;font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topContext{color:var(--fg3);font-size:12px;white-space:nowrap}
#content{flex:1;overflow-y:auto;padding:22px 26px;min-height:0}
#conversation{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.ctx-banner{background:var(--elev);border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:12px;color:var(--fg3)}
.ctx-banner b{display:block;color:var(--fg);font-size:13px;margin-bottom:2px}
.msg{max-width:92%;border-radius:14px;padding:11px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg .who{font-size:11px;color:var(--fg3);margin-bottom:4px}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,#2b3a5e,#26324a);border:1px solid #35496f}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.msg.sys{align-self:center;background:transparent;border:1px dashed var(--line);color:var(--fg3);font-size:12px;max-width:100%}
.msg .caret{display:inline-block;width:7px;height:14px;background:var(--accent-soft);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tool-card{align-self:flex-start;width:92%;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-family:var(--mono);font-size:12px;overflow:hidden}
.tool-head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);color:var(--fg2)}
.tool-head .t{color:var(--accent-soft)}
.tool-head .st{margin-left:auto;color:var(--cap)}
.tool-head .st.ok{color:var(--green)}.tool-head .st.run{color:var(--warn)}
.tool-body{padding:9px 12px;color:var(--fg3);white-space:pre-wrap;overflow-wrap:anywhere;max-height:140px;overflow-y:auto}
.notice-card{align-self:flex-start;width:92%;background:var(--elev);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:10px;padding:11px 13px}
.notice-card.warn{border-left-color:var(--warn)}
.notice-card b{color:var(--fg)}
.notice-card .rc-actions{display:flex;gap:8px;margin-top:9px}
.typing{align-self:flex-start;color:var(--fg3);font-size:12px;padding:4px 2px}
.typing i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--fg3);margin-right:4px;animation:td 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes td{0%,60%,100%{opacity:.25}30%{opacity:1}}
#permissionBar{border-top:1px solid var(--line);background:var(--panel);padding:12px 22px}
#permissionBar.hidden{display:none}
.perm-row{display:flex;align-items:center;gap:10px;max-width:820px;margin:0 auto}
.perm-row .txt{flex:1;font-size:13px;color:var(--warn)}
#composer{border-top:1px solid var(--line);background:var(--panel);padding:12px 22px;display:flex;gap:8px}
#recipient{background:var(--elev);border:1px solid var(--line);border-radius:9px;color:var(--fg);padding:0 9px;max-width:170px;outline:0;font:inherit}
#message{flex:1;background:var(--elev);border:1px solid var(--line);border-radius:9px;color:var(--fg);padding:10px 12px;outline:0;font:inherit}
#message:focus{border-color:var(--accent)}
.send{background:var(--accent);border:0;border-radius:9px;color:#fff;padding:0 18px;font:inherit;cursor:pointer}
.send:hover{filter:brightness(1.12)}
/* 右栏 */
#right{background:var(--panel);border-left:1px solid var(--line);padding:16px 14px;display:flex;flex-direction:column;gap:11px;min-height:0;overflow:hidden}
.rp-title{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;border:0;background:transparent;color:var(--fg3);padding:8px 2px;cursor:pointer;font:inherit;font-size:13px;border-bottom:2px solid transparent}
.tab.active{color:var(--fg);border-bottom-color:var(--accent)}
.pane{display:none;overflow-y:auto;min-height:0;flex:1}
.pane.active{display:block}
.card{background:var(--elev);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.card h4{margin:0 0 8px;font-size:12px;color:var(--fg3);font-weight:650}
.prog-num{font-size:22px;font-weight:700;color:var(--accent-soft)}
.prog-bar{height:6px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:7px}
.prog-bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .5s}
.member{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--line)}
.member:first-of-type{border-top:0;padding-top:0}
.avatar{width:28px;height:28px;border-radius:8px;background:var(--accent-bg);color:var(--accent-soft);display:grid;place-items:center;font-size:12px;font-weight:650;flex:none}
.member .mi{flex:1;min-width:0}.member .mi b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member .mi span{display:block;font-size:11px;color:var(--cap);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:var(--fg3);flex:none}
.dot.blue{background:var(--accent);animation:pulse 1.4s infinite}
.dot.green{background:var(--green)}.dot.orange{background:var(--warn)}.dot.red{background:var(--red)}
@keyframes pulse{50%{opacity:.35}}
.event{padding:9px 2px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--fg2)}
.event:last-child{border-bottom:0}
.event .et{color:var(--cap);font-size:11px;margin-bottom:2px}
.event .et b{color:var(--accent-soft)}
.task{border-left:3px solid var(--line);background:var(--elev);border-radius:0 8px 8px 0;padding:9px 11px;margin-bottom:8px}
.task.running{border-left-color:var(--accent)}.task.done{border-left-color:var(--green)}.task.failed{border-left-color:var(--red)}
.task .tt{font-weight:600;font-size:13px}
.task .tm{font-size:11px;color:var(--cap);margin-top:2px}
.task .ta{display:flex;gap:6px;margin-top:7px}
.file-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;padding:6px 2px;border-bottom:1px solid var(--line);color:var(--fg2)}
.file-row .add{color:var(--green)}.file-row .del{color:var(--red)}
.empty-tip{color:var(--cap);text-align:center;padding:26px 8px;font-size:12px}
/* 弹层 */
.overlay{position:fixed;inset:0;background:rgba(8,10,14,.6);display:none;align-items:center;justify-content:center;z-index:40;padding:18px}
.overlay.show{display:flex}
.modal{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.modal h2{margin:0 0 4px;font-size:17px}
.modal .desc{color:var(--fg3);font-size:13px;margin:0 0 16px}
.field{margin:12px 0}
.field label{display:block;font-size:12px;font-weight:650;color:var(--fg2);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;background:var(--elev);border:1px solid var(--line);border-radius:9px;color:var(--fg);padding:9px 11px;outline:0;font:inherit}
.field textarea{resize:vertical;min-height:72px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{background:var(--accent-bg);color:var(--accent-soft);border-radius:16px;padding:4px 10px;font-size:12px}
.mactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#toast{position:fixed;right:22px;bottom:22px;background:#242c3a;color:var(--fg);border:1px solid var(--line);padding:10px 15px;border-radius:10px;display:none;z-index:60;font-size:13px}
#toast.show{display:block}
/* diff 弹窗 */
.diff{font-family:var(--mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;max-height:300px;overflow:auto;white-space:pre;color:var(--fg2)}
.diff .plus{color:var(--green);background:rgba(63,185,80,.08);display:block}
.diff .minus{color:var(--red);background:rgba(248,81,73,.08);display:block}
.diff .hunk{color:var(--accent-soft);display:block;margin-top:6px}
@media(max-width:1080px){.app{grid-template-columns:250px minmax(0,1fr)}#right{display:none}}
@media(max-width:680px){.app{display:flex;flex-direction:column}#sidebar{display:none}#content{padding:14px 12px}#composer,#permissionBar{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<div class="app">
<aside id="sidebar">
  <div class="brand"><span class="logo">✦</span> newbee</div>
  <button class="btn primary" id="newSession" style="width:100%">＋ 新会话</button>
  <input class="search" id="search" placeholder="搜索会话…">
  <div class="side-head"><span>会话</span><span id="selectedCount">0 个已选</span></div>
  <div id="sessions"></div>
  <div class="side-foot"><button class="btn" id="makeGroup" style="width:100%">把选中的会话组成工作组</button>
  <div style="margin-top:9px">勾选多个会话可让它们共同完成一件事；子会话会显示在分组下面。</div></div>
</aside>
<main id="main">
  <header id="topbar"><div id="topTitle">认证系统重构</div><span id="topContext">总控会话</span><button class="btn small demo-run" id="runDemo">▶ 运行完整演示</button><button class="btn small" id="addChild">＋ 让另一个 AI 帮忙</button></header>
  <div id="content"><div id="conversation"></div></div>
  <div id="permissionBar" class="hidden"><div class="perm-row"><span class="txt" id="permText">允许执行？</span><button class="btn small" id="permYes">允许</button><button class="btn small" id="permNo">拒绝</button></div></div>
  <footer id="composer"><select id="recipient"></select><input id="message" placeholder="输入消息…"><button class="send" id="send">发送</button></footer>
</main>
<aside id="right">
  <div class="rp-title" id="rpTitle">认证系统重构</div>
  <div class="tabs">
    <button class="tab active" data-pane="overview">概览</button>
    <button class="tab" data-pane="collab">协作消息</button>
    <button class="tab" data-pane="tasks">工作项</button>
    <button class="tab" data-pane="files">文件</button>
  </div>
  <div class="pane active" id="pane-overview"></div>
  <div class="pane" id="pane-collab"></div>
  <div class="pane" id="pane-tasks"></div>
  <div class="pane" id="pane-files"></div>
</aside>
</div>
<div class="overlay" id="modalOverlay"><div class="modal">
<h2 id="modalTitle">组成工作组</h2><p class="desc" id="modalDesc">选中的会话仍然各自保留，之后可以单独点进去查看。</p>
<div class="chips" id="modalChips"></div>
<div class="field" id="nameField"><label id="nameLabel">名称</label><input id="modalName" placeholder="输入名称"></div>
<div class="field" id="modeField"><label id="goalLabel">共同要完成什么？</label><textarea id="modalGoal" rows="3" placeholder="例如：重构认证系统，并补齐测试"></textarea></div>
<div class="field" id="ownerField"><label>交给谁？</label><select id="modalOwner"></select></div>
<div class="mactions"><button class="btn" id="modalCancel">取消</button><button class="btn primary" id="modalConfirm">确认</button></div>
</div></div>
<div class="overlay" id="diffOverlay"><div class="modal">
<h2>文件变更预览</h2><p class="desc">以下修改由子会话提交，需要你审查后才应用。</p>
<div class="diff" id="diffBody"></div>
<div class="mactions"><button class="btn" id="diffClose">关闭</button><button class="btn primary" id="diffApply">审查通过，应用变更</button></div>
</div></div>
<div class="ctx-menu-demo" id="sessionMenu"><button id="menuRename">重命名</button><button id="menuRemove">移出工作组</button><button id="menuDelete" class="danger">删除会话</button></div>
<div id="toast"></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const state = {
  activeId: "main", nextSession: 1, nextGroup: 2, nextTask: 1,
  demoRunning: false, permissionQueue: [], modalMode: "group", menuSessionId: null,
  groups: [{ id: "g1", name: "认证系统重构", goal: "重构认证系统，并补齐测试", members: ["main", "dev", "test", "review"] }],
  sessions: [
    { id: "main", name: "认证系统重构", role: "总控", status: "工作中", group: "g1" },
    { id: "dev", name: "登录接口开发", role: "开发员", status: "等待", group: "g1" },
    { id: "test", name: "认证测试", role: "测试员", status: "等待", group: "g1" },
    { id: "review", name: "安全审查", role: "审查员", status: "等待", group: "g1" },
    { id: "db", name: "数据库迁移", role: "普通会话", status: "空闲", group: null },
    { id: "perf", name: "性能问题分析", role: "普通会话", status: "空闲", group: null }
  ],
  messages: {
    main: [{ kind: "user", text: "请重构认证系统，并补齐测试。" }, { kind: "ai", text: "我已经建立工作组。点击“运行完整演示”可以查看子会话如何协作。" }],
    dev: [{ kind: "sys", text: "等待用户启动演示。" }],
    test: [{ kind: "sys", text: "等待用户启动演示。" }],
    review: [{ kind: "sys", text: "等待用户启动演示。" }],
    db: [{ kind: "ai", text: "上次讨论到第三步迁移脚本。需要继续吗？" }],
    perf: [{ kind: "ai", text: "首页加载主要耗时在图片未压缩。需要我写优化方案吗？" }]
  },
  events: [{ from: "总控", to: "测试员", text: "请补充过期凭证测试。" }],
  tasks: [
    { id: "t1", title: "分析现有认证逻辑", owner: "开发员", status: "pending" },
    { id: "t2", title: "修改登录接口", owner: "开发员", status: "pending" },
    { id: "t3", title: "补充认证测试", owner: "测试员", status: "pending" },
    { id: "t4", title: "安全审查", owner: "未分配", status: "pending" }
  ],
  files: [], applied: false
};
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const findSession = (id) => state.sessions.find((s) => s.id === id);
const active = () => findSession(state.activeId) || state.sessions[0];
const activeGroup = () => { const s = active(); return s.group ? state.groups.find((g) => g.id === s.group) : null; };
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
let toastTimer;
function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200); }
function statusDot(status) { return status === "工作中" ? "dot blue" : status === "等待" ? "dot orange" : status === "已完成" ? "dot green" : "dot"; }
function sessionButtonHTML(s, isHead) {
  return '<button class="session' + (isHead ? "" : " child") + (s.id === state.activeId ? " active" : "") + '" data-open="' + s.id + '">' +
    '<span class="nm">' + esc(s.name) + (s.unread ? '<span class="badge">' + s.unread + '</span>' : "") + '</span>' +
    '<span class="mt"><i class="' + statusDot(s.status) + '"></i>' + esc(s.role) + ' · ' + esc(s.status) + '</span></button>';
}
function renderSidebar() {
  const root = $("sessions"); root.innerHTML = ""; const grouped = new Set();
  state.groups.forEach((g) => {
    const head = findSession(g.members[0]); if (!head) return; grouped.add(head.id);
    const wrap = document.createElement("div");
    wrap.innerHTML = '<div class="srow"><button class="toggle" data-fold="' + g.id + '">▾</button><span class="pick-wrap"></span>' + sessionButtonHTML(head, true) + '<button class="session-menu-btn" data-menu="' + head.id + '">⋯</button></div><div class="group-nav" data-children="' + g.id + '"></div>';
    root.appendChild(wrap); const kids = wrap.querySelector('[data-children="' + g.id + '"]');
    g.members.slice(1).forEach((id) => { const s = findSession(id); if (!s) return; grouped.add(id); kids.insertAdjacentHTML("beforeend", '<div class="srow"><input type="checkbox" class="pick" data-pick="' + id + '">' + sessionButtonHTML(s, false) + '<button class="session-menu-btn" data-menu="' + id + '">⋯</button></div>'); });
  });
  const others = state.sessions.filter((s) => !grouped.has(s.id)); if (others.length) root.insertAdjacentHTML("beforeend", '<div class="group-label">其他会话</div>');
  others.forEach((s) => root.insertAdjacentHTML("beforeend", '<div class="srow"><input type="checkbox" class="pick" data-pick="' + s.id + '">' + sessionButtonHTML(s, false) + '<button class="session-menu-btn" data-menu="' + s.id + '">⋯</button></div>'));
  root.querySelectorAll("[data-open]").forEach((b) => b.onclick = () => openSession(b.dataset.open));
  root.querySelectorAll("[data-fold]").forEach((b) => b.onclick = () => { const kids = root.querySelector('[data-children="' + b.dataset.fold + '"]'); const fold = kids.style.display !== "none"; kids.style.display = fold ? "none" : "flex"; b.textContent = fold ? "▸" : "▾"; });
  root.querySelectorAll("[data-menu]").forEach((b) => b.onclick = (e) => openSessionMenu(b.dataset.menu, e));
  root.querySelectorAll(".pick").forEach((p) => p.onchange = updateSelectedCount); updateSelectedCount();
}
function updateSelectedCount() { $("selectedCount").textContent = document.querySelectorAll(".pick:checked").length + " 个已选"; }
function renderRecipients() {
  const select = $("recipient"), s = active(), g = activeGroup(); select.innerHTML = '<option value="' + s.id + '">发给当前会话</option>';
  if (g) { g.members.filter((id) => id !== s.id).forEach((id) => { const m = findSession(id); if (m) select.insertAdjacentHTML("beforeend", '<option value="' + id + '">发给：' + esc(m.name) + '</option>'); }); select.insertAdjacentHTML("beforeend", '<option value="__all">发给所有协作会话</option>'); }
}
function msgHTML(m) {
  if (m.kind === "tool") return '<div class="tool-card"><div class="tool-head"><span class="t">⚙ ' + esc(m.title) + '</span><span class="st ' + (m.done ? "ok" : "run") + '">' + (m.done ? "✓ 完成" : "运行中…") + '</span></div><div class="tool-body">' + esc(m.code) + '</div></div>';
  if (m.kind === "sys") return '<div class="msg sys">' + esc(m.text) + '</div>';
  const cls = m.kind === "user" ? "user" : "ai"; const who = m.kind === "user" ? "我" : (m.name || "AI");
  return '<div class="msg ' + cls + '"><div class="who">' + esc(who) + '</div>' + esc(m.text) + (m.typing ? '<span class="caret"></span>' : "") + '</div>';
}
function renderConversation() {
  const s = active(), g = activeGroup(); s.unread = 0; $("topTitle").textContent = s.name; $("topContext").textContent = s.role + (g ? " · " + g.name : ""); $("rpTitle").textContent = s.name;
  $("conversation").innerHTML = '<div class="ctx-banner"><b>' + esc(s.name) + '</b>' + (g ? (s.id === g.members[0] ? "总控会话：负责安排工作并接收结果。" : "协作会话：这里显示它自己的完整工作过程。") : "普通会话，操作方式和以前一样。") + '</div>' + (state.messages[s.id] || []).map(msgHTML).join("");
  $("content").scrollTop = $("content").scrollHeight; renderRecipients(); renderSidebar(); renderRight();
}
function openSession(id) { state.activeId = id; renderConversation(); }
function pushMessage(id, msg) { if (!state.messages[id]) state.messages[id] = []; state.messages[id].push(msg); const s = findSession(id); if (s && id !== state.activeId) s.unread = (s.unread || 0) + 1; if (id === state.activeId) renderConversation(); else renderSidebar(); }
function typeOut(id, text, name) { return new Promise((resolve) => { const m = { kind: "ai", name, text: "", typing: true }; pushMessage(id, m); let i = 0; const timer = setInterval(() => { i += 2; m.text = text.slice(0, i); m.typing = i < text.length; if (id === state.activeId) renderConversation(); if (i >= text.length) { clearInterval(timer); m.typing = false; resolve(); } }, 30); }); }

function renderRight() {
  const g = activeGroup();
  if (!g) {
    $("pane-overview").innerHTML = '<div class="plain-overview"><div class="ico">◌</div><b>普通会话</b><div>这个会话没有加入工作组。你仍然可以像以前一样聊天和查看工具调用。</div></div>';
    $("pane-collab").innerHTML = '<div class="empty-tip">普通会话没有协作消息</div>';
    $("pane-tasks").innerHTML = '<div class="empty-tip">普通会话没有工作项</div>';
    $("pane-files").innerHTML = '<div class="empty-tip">还没有文件变更</div>';
    return;
  }
  const groupTasks = state.tasks; const done = groupTasks.filter((t) => t.status === "done").length; const pct = groupTasks.length ? Math.round(done / groupTasks.length * 100) : 0;
  $("pane-overview").innerHTML = '<div class="card"><h4>总体进度</h4><div class="prog-num">' + pct + '%</div><div class="prog-bar"><i style="width:' + pct + '%"></i></div><div style="font-size:11px;color:var(--cap);margin-top:6px">' + done + ' / ' + groupTasks.length + ' 项完成</div></div><div class="card"><h4>AI 成员</h4>' + g.members.map((id) => { const m = findSession(id); return m ? '<div class="member"><div class="avatar">' + esc(m.name.slice(0, 1)) + '</div><div class="mi"><b>' + esc(m.name) + '</b><span>' + esc(m.role) + ' · ' + esc(m.status) + '</span></div><i class="' + statusDot(m.status) + '"></i></div>' : ""; }).join("") + '</div>';
  $("pane-collab").innerHTML = '<button class="btn" id="refreshCollab" style="width:100%;margin-bottom:9px">刷新</button>' + state.events.map((e) => '<div class="event"><div class="et"><b>' + esc(e.from) + '</b> → <b>' + esc(e.to) + '</b></div>' + esc(e.text) + '</div>').join("");
  $("refreshCollab").onclick = () => toast("协作消息已刷新");
  $("pane-tasks").innerHTML = '<button class="btn primary" id="newTask" style="width:100%;margin-bottom:9px">＋ 新建工作项</button>' + state.tasks.map((t, idx) => { const cls = t.status === "done" ? "done" : t.status === "running" ? "running" : ""; const label = t.status === "done" ? "已完成" : t.status === "running" ? "进行中" : "未开始"; const actions = t.status === "pending" ? '<div class="ta"><button class="btn small" data-claim="' + idx + '">开始工作</button></div>' : t.status === "running" ? '<div class="ta"><button class="btn small" data-msg="' + esc(t.owner) + '">发消息</button></div>' : ""; return '<div class="task ' + cls + '"><div class="tt">' + esc(t.title) + '</div><div class="tm">' + esc(t.owner) + ' · ' + label + '</div>' + actions + '</div>'; }).join("");
  $("newTask").onclick = () => openForm("task");
  document.querySelectorAll("[data-claim]").forEach((b) => b.onclick = () => { const t = state.tasks[+b.dataset.claim]; t.status = "running"; t.owner = active().role; renderRight(); toast("已开始：" + t.title); });
  document.querySelectorAll("[data-msg]").forEach((b) => b.onclick = () => { const target = state.sessions.find((s) => s.role === b.dataset.msg || s.name === b.dataset.msg); if (target) $("recipient").value = target.id; $("message").focus(); });
  $("pane-files").innerHTML = state.files.length ? state.files.map((f) => '<div class="file-row"><span>' + esc(f.path) + '</span><span><span class="add">+' + f.added + '</span> <span class="del">-' + f.del + '</span></span></div>').join("") + '<div style="margin-top:10px;display:flex;gap:8px"><button class="btn" id="showDiff" style="flex:1">查看 Diff</button><button class="btn primary" id="applyBtn" style="flex:1" ' + (state.applied ? "disabled" : "") + '>' + (state.applied ? "已应用" : "审查后应用") + '</button></div>' : '<div class="empty-tip">还没有文件变更</div>';
  if ($("showDiff")) $("showDiff").onclick = openDiff;
  if ($("applyBtn")) $("applyBtn").onclick = () => { state.applied = true; renderRight(); toast("变更已应用到主工作区"); };
}
function requestPermission(sessionId, code) { return new Promise((resolve) => { state.permissionQueue.push({ sessionId, code, resolve }); showPermission(); }); }
function showPermission() { if (!$("permissionBar").classList.contains("hidden")) return; const p = state.permissionQueue[0]; if (!p) return; $("permText").textContent = "「" + findSession(p.sessionId).name + "」请求执行：" + p.code; $("permissionBar").classList.remove("hidden"); }
function answerPermission(ok) { const p = state.permissionQueue.shift(); $("permissionBar").classList.add("hidden"); if (p) { if (!ok) pushMessage(p.sessionId, { kind: "sys", text: "用户拒绝了本次文件写入。" }); p.resolve(ok); } setTimeout(showPermission, 80); }
async function simulateChildWork(id, title) {
  const s = findSession(id); s.status = "工作中"; renderConversation(); pushMessage(id, { kind: "sys", text: "收到任务：" + title });
  await typeOut(id, "好的，我开始处理。先读取相关代码。", s.role); await sleep(350);
  const read = { kind: "tool", title: "run_elixir · 读取文件", code: 'Newbee.Tools.Fs.read("lib/auth.ex")', done: false }; pushMessage(id, read); await sleep(650); read.done = true; read.code += "\n# ✓ ok · 返回 214 字节"; if (id === state.activeId) renderConversation();
  await typeOut(id, "代码结构清楚了，我准备写入修改。", s.role); const allowed = await requestPermission(id, 'Newbee.Tools.Fs.write!("lib/auth.ex", content)');
  if (!allowed) { s.status = "等待"; renderConversation(); return; }
  pushMessage(id, { kind: "tool", title: "run_elixir · 写入文件", code: 'Newbee.Tools.Fs.write!("lib/auth.ex", content)', done: true });
  const testTool = { kind: "tool", title: "运行测试", code: "mix test test/auth_test.exs", done: false }; pushMessage(id, testTool); await sleep(800); testTool.done = true; testTool.code += "\n# ✓ 3 tests, 0 failures"; if (id === state.activeId) renderConversation();
  await typeOut(id, "完成，修改已通过测试。", s.role); s.status = "已完成"; state.files = [{ path: "lib/auth.ex", added: 36, del: 9 }, { path: "test/auth_test.exs", added: 44, del: 0 }]; state.tasks.filter((t) => t.owner === s.role).forEach((t) => t.status = "done"); pushMessage("main", { kind: "sys", text: "✓ " + s.name + " 已完成：" + title }); renderConversation(); toast(s.name + " 已完成");
}
function openDiff() { const diff = [["hunk", "@@ lib/auth.ex @@"], ["minus", "- password == stored_password"], ["plus", "+ crypto.compare(password, stored_password)"], ["plus", "+ rescue _ -> {:error, :invalid_credentials}"], ["hunk", "@@ test/auth_test.exs @@"], ["plus", '+ test "rejects expired token" do'], ["plus", "+   assert {:error, :expired} = Auth.verify(token)"], ["plus", "+ end"]]; $("diffBody").innerHTML = diff.map(([c,t]) => '<span class="' + c + '">' + esc(t) + '</span>').join(""); $("diffOverlay").classList.add("show"); }
function closeForm() { $("modalOverlay").classList.remove("show"); }
function prepareOwners() { $("modalOwner").innerHTML = '<option value="">不指定</option>' + state.sessions.map((s) => '<option value="' + s.id + '">' + esc(s.name) + '</option>').join(""); }
function openForm(mode, sessionId) {
  state.modalMode = mode; state.menuSessionId = sessionId || null; prepareOwners(); $("modalChips").innerHTML = ""; $("modalName").value = ""; $("modalGoal").value = ""; $("nameField").style.display = "block"; $("ownerField").style.display = mode === "task" ? "block" : "none"; $("modeField").style.display = mode === "rename" || mode === "newSession" ? "none" : "block";
  const cfg = { group: ["组成工作组", "选中的会话仍然各自保留，之后可以单独查看。", "工作组名称", "共同要完成什么？"], child: ["让另一个 AI 帮忙", "系统会自动创建一个关联会话，并加入当前工作组。", "会话名称", "让它负责什么？"], task: ["新建工作项", "工作项会显示在右侧，并可分配给一个会话。", "工作项名称", "补充说明"], newSession: ["新会话", "创建一个独立的普通会话。", "会话名称", ""], rename: ["重命名会话", "修改会话在左侧显示的名称。", "新名称", ""] }[mode];
  $("modalTitle").textContent = cfg[0]; $("modalDesc").textContent = cfg[1]; $("nameLabel").textContent = cfg[2]; $("goalLabel").textContent = cfg[3];
  if (mode === "group") { const picks = [...document.querySelectorAll(".pick:checked")]; if (!picks.length) { toast("请先勾选会话"); return; } $("modalChips").innerHTML = picks.map((p) => '<span class="chip">' + esc(findSession(p.dataset.pick).name) + '</span>').join(""); }
  if (mode === "child") $("modalChips").innerHTML = '<span class="chip">当前：' + esc(active().name) + '</span>';
  if (mode === "rename") $("modalName").value = findSession(sessionId).name;
  $("modalOverlay").classList.add("show"); $("modalName").focus();
}
function confirmForm() {
  const name = $("modalName").value.trim(), goal = $("modalGoal").value.trim();
  if (!name && state.modalMode !== "group") { toast("请填写名称"); return; }
  if (state.modalMode === "newSession") { const id = "session" + state.nextSession++; state.sessions.push({ id, name, role: "普通会话", status: "空闲", group: null }); state.messages[id] = []; closeForm(); openSession(id); return; }
  if (state.modalMode === "rename") { findSession(state.menuSessionId).name = name; closeForm(); renderConversation(); return; }
  if (state.modalMode === "child") { const id = "child" + state.nextSession++, g = activeGroup() || state.groups[0]; g.members.push(id); state.sessions.push({ id, name, role: "新成员", status: "等待", group: g.id }); state.messages[id] = []; state.tasks.push({ title: goal || name, owner: name, status: "running" }); state.events.push({ from: active().name, to: name, text: "请负责：" + (goal || name) }); closeForm(); openSession(id); toast("关联会话已创建，点击演示按钮可看它工作"); return; }
  if (state.modalMode === "task") { const ownerId = $("modalOwner").value, owner = ownerId ? findSession(ownerId).role : "未分配"; state.tasks.push({ title: name, owner, status: ownerId ? "running" : "pending" }); closeForm(); renderRight(); return; }
  if (state.modalMode === "group") { const ids = [...document.querySelectorAll(".pick:checked")].map((p) => p.dataset.pick), gid = "g" + state.nextGroup++; state.groups.push({ id: gid, name: name || goal || "新工作组", goal, members: ids }); ids.forEach((id,i) => { const s=findSession(id); s.group=gid; s.role=i===0?"总控":"成员"; }); closeForm(); renderConversation(); }
}
function openSessionMenu(id, event) { state.menuSessionId = id; const m = $("sessionMenu"); m.style.left = Math.min(event.clientX, window.innerWidth - 150) + "px"; m.style.top = Math.min(event.clientY, window.innerHeight - 130) + "px"; m.classList.add("show"); }
function removeFromGroup(id) { const s=findSession(id); if (!s.group) return; const g=state.groups.find((x)=>x.id===s.group); if (g) g.members=g.members.filter((x)=>x!==id); s.group=null; s.role="普通会话"; renderConversation(); }
function deleteSession(id) { if (state.sessions.length <= 1) return; state.sessions=state.sessions.filter((s)=>s.id!==id); state.groups.forEach((g)=>g.members=g.members.filter((x)=>x!==id)); delete state.messages[id]; if (state.activeId===id) state.activeId=state.sessions[0].id; renderConversation(); }
function sendMessage() {
  const input=$("message"), text=input.value.trim(); if(!text)return; const sel=$("recipient"), target=sel.value, from=active();
  if (target===from.id) { pushMessage(from.id,{kind:"user",text}); setTimeout(()=>typeOut(from.id,"收到，我来处理。",from.role),500); }
  else if (target==="__all") { const g=activeGroup(); if(g)g.members.filter((id)=>id!==from.id).forEach((id)=>{state.events.push({from:from.name,to:findSession(id).name,text});pushMessage(id,{kind:"ai",name:"来自 "+from.name,text});}); renderRight(); }
  else { const to=findSession(target); state.events.push({from:from.name,to:to.name,text}); pushMessage(target,{kind:"ai",name:"来自 "+from.name,text}); renderRight(); setTimeout(()=>typeOut(target,"收到，我马上处理。",to.role),600); }
  input.value=""; toast("消息已发送");
}
async function runDemo() { if(state.demoRunning)return; state.demoRunning=true; const b=$("runDemo"); b.textContent="演示运行中…"; b.classList.add("running"); await simulateChildWork("test","补充过期凭证测试"); state.demoRunning=false; b.textContent="▶ 再次运行演示"; b.classList.remove("running"); }

/* 事件绑定与初始化 */
$("runDemo").onclick = runDemo;
$("newSession").onclick = () => openForm("newSession");
$("addChild").onclick = () => openForm("child");
$("makeGroup").onclick = () => openForm("group");
$("modalCancel").onclick = closeForm;
$("modalConfirm").onclick = confirmForm;
$("modalOverlay").onclick = (e) => { if (e.target === $("modalOverlay")) closeForm(); };
$("send").onclick = sendMessage;
$("message").onkeydown = (e) => { if (e.key === "Enter") sendMessage(); };
$("permYes").onclick = () => answerPermission(true);
$("permNo").onclick = () => answerPermission(false);
$("diffClose").onclick = () => $("diffOverlay").classList.remove("show");
$("diffApply").onclick = () => { $("diffOverlay").classList.remove("show"); state.applied = true; renderRight(); toast("变更已应用"); };
$("diffOverlay").onclick = (e) => { if (e.target === $("diffOverlay")) $("diffOverlay").classList.remove("show"); };
document.querySelectorAll(".tab").forEach((tab) => tab.onclick = () => { document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active")); document.querySelectorAll(".pane").forEach((p) => p.classList.remove("active")); tab.classList.add("active"); $("pane-" + tab.dataset.pane).classList.add("active"); });
$("search").oninput = (e) => { const q=e.target.value.trim().toLowerCase(); document.querySelectorAll("#sessions .session").forEach((s)=>{s.parentElement.style.display=(!q||s.textContent.toLowerCase().includes(q))?"flex":"none";}); };
$("menuRename").onclick = () => { $("sessionMenu").classList.remove("show"); openForm("rename", state.menuSessionId); };
$("menuRemove").onclick = () => { $("sessionMenu").classList.remove("show"); removeFromGroup(state.menuSessionId); toast("已移出工作组"); };
$("menuDelete").onclick = () => { $("sessionMenu").classList.remove("show"); if(confirm("确定删除这个会话吗？")){deleteSession(state.menuSessionId);toast("会话已删除");} };
document.addEventListener("click", (e) => { if (!e.target.closest("#sessionMenu") && !e.target.closest("[data-menu]")) $("sessionMenu").classList.remove("show"); });
/* 默认静止，不自动跑任务 */
renderConversation();
renderRight();

</script>
</body>
